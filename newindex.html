<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  
  <title>Frontend Mentor | Product list with cart</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

    <div class="product-list">
        <h1>Desserts</h1>

        <div class="product-card">
        <img src="./assets/images/waffle.jpg" alt="Waffle with Berries">
        <h2>Waffle with Berries</h2>
        <p class="product-type">Waffle</p>
        <p class="product-price">$6.50</p>
        <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
        <img src="./assets/images/creme-brulee.jpg" alt="Vanilla Bean Crème Brûlée">
        <h2>Vanilla Bean Crème Brûlée</h2>
        <p class="product-type">Crème Brûlée</p>
        <p class="product-price">$7.00</p>
        <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
        <img src="./assets/images/macaron.jpg" alt="Macaron Mix of Five">
        <h2>Macaron Mix of Five</h2>
        <p class="product-type">Macaron</p>
        <p class="product-price">$8.00</p>
        <button class="add-to-cart">Add to Cart</button>
        </div>

    <!-- Add more product cards as needed -->
    </div>

    <div class="cart">
        <h2>Your Cart <span>(<!-- Quantity -->)</span></h2>
        <p class="cart-empty">Your added items will appear here</p>
        <ul class="cart-items">
        <!-- Cart items will be dynamically added here -->
        </ul>
        <p class="cart-total">Total: $0.00</p>
        <button class="checkout">Checkout</button>
    </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
